name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify pinned SDK
        run: |
          SDK_VERSION=$(dotnet --version)
          echo "Installed SDK: $SDK_VERSION"
          test "$SDK_VERSION" = "10.0.301"

      - name: Restore (locked mode when lock files exist)
        run: |
          if find . -name 'packages.lock.json' | grep -q .; then
            dotnet restore --locked-mode
          else
            dotnet restore
          fi

      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Pack
        run: |
          mkdir -p artifacts/packages
          dotnet pack -c Release --no-build -o artifacts/packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-and-tests
          path: |
            artifacts/packages/**
            artifacts/test-results/**

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
